<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ghostBody" x1="32" y1="14" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dce6f4" />
    </linearGradient>
    <linearGradient id="devilRed" x1="12" y1="6" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a39" />
      <stop offset="0.55" stop-color="#ee2222" />
      <stop offset="1" stop-color="#bd0f0f" />
    </linearGradient>

    <!-- Halos are doubled blurs so the bloom survives the downscale to 16px.
         Each glowing element is drawn twice: once through the filter, once
         solid on top, so the blur never washes out the core colour. -->
    <filter id="ghostGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.4" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="far" />
        <feMergeNode in="near" />
        <feMergeNode in="near" />
      </feMerge>
    </filter>
    <filter id="hellGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="far" />
        <feMergeNode in="near" />
      </feMerge>
    </filter>

    <g id="devilParts" fill="url(#devilRed)">
      <path d="M41 47C49 50 56 47 56.5 39" fill="none" stroke="url(#devilRed)" stroke-width="3" stroke-linecap="round" />
      <path d="M56.5 31.5C57.8 35.5 60.2 38.6 59.9 41.2L53.1 41.2C52.8 38.6 55.2 35.5 56.5 31.5Z" />
      <path d="M17.8 22.2C14.8 18.5 13 13.5 14 8.5C17 14.5 21.5 15.5 26.2 16.6Z" />
      <path d="M40.2 22.2C43.2 18.5 45 13.5 44 8.5C41 14.5 36.5 15.5 31.8 16.6Z" />
    </g>
    <path
      id="ghostShape"
      d="M15 48V30a14 14 0 0 1 28 0v18q-4.67 10-9.33 0-4.67 10-9.34 0-4.66 10-9.33 0Z"
    />
  </defs>

  <!-- Whole mark recentred in the 64x64 box; the margin is headroom for bloom. -->
  <g transform="translate(-3.75 -0.5)">
    <!-- Horns and tail sit behind the body so their roots vanish under it. -->
    <use href="#devilParts" filter="url(#hellGlow)" />
    <use href="#devilParts" />

    <use href="#ghostShape" filter="url(#ghostGlow)" fill="#ffffff" />
    <use href="#ghostShape" fill="url(#ghostBody)" />
    <!-- Hairline keeps the silhouette legible on light backgrounds, where the
         white bloom has nothing to read against. -->
    <use href="#ghostShape" fill="none" stroke="#aebfd6" stroke-width="0.7" stroke-opacity="0.85" />

    <ellipse cx="23" cy="30" rx="2.6" ry="3.4" fill="#141414" />
    <ellipse cx="35" cy="30" rx="2.6" ry="3.4" fill="#141414" />
  </g>
</svg>
