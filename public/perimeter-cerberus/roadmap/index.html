* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px;
}

/* --- masthead ----------------------------------------------------- */

.masthead { background: var(--surface); border-bottom: 1px solid var(--rule); padding: var(--pad); }
.masthead-inner { max-width: 1120px; margin: 0 auto; }

.eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); margin: 0;
}

h1 {
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.05;
  letter-spacing: -0.02em; text-wrap: balance; margin: 0.4rem 0 0.5rem;
}

.subtitle { font-size: 1.05rem; color: var(--ink-soft); max-width: 56ch; margin: 0 0 1.6rem; }

.tallies {
  display: flex; flex-wrap: wrap; gap: 0 2.6rem;
  border-top: 1px solid var(--rule); padding-top: 1rem; margin: 0;
}
.tally dt {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.tally dd {
  margin: 0.2rem 0 1rem;
  font-family: var(--serif); font-size: 1.75rem; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.tally dd small { font-size: 0.95rem; color: var(--muted); font-family: var(--sans); }

/* --- layout ------------------------------------------------------- */

.shell {
  max-width: 1120px; margin: 0 auto; padding: 0 var(--pad) 5rem;
  display: grid; grid-template-columns: 14rem minmax(0, 1fr);
  gap: 3rem; align-items: start;
}

.toc { position: sticky; top: 1rem; padding-top: 2rem; display: flex; flex-direction: column; }
.toc a {
  border-left: 2px solid var(--rule); padding: 0.32rem 0 0.32rem 0.7rem;
  font-size: 12.5px; color: var(--muted); text-decoration: none;
}
.toc a:hover { color: var(--ink); border-left-color: var(--rule-strong); }

main { padding-top: 2rem; min-width: 0; }

section { margin-bottom: 3.2rem; scroll-margin-top: 1rem; }
h2 {
  font-family: var(--serif); font-size: 1.45rem; font-weight: 600;
  letter-spacing: -0.012em; margin: 0 0 0.4rem;
  border-top: 2px solid var(--ink); padding-top: 0.75rem;
}
.lede { color: var(--ink-soft); max-width: 64ch; margin: 0 0 1.2rem; }

/* --- tracks ------------------------------------------------------- */

.tracks { display: grid; gap: 1rem; }
.track {
  background: var(--surface); border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 3px; padding: 1rem 1.1rem;
}
.track.is-complete { border-left-color: var(--accent); }
.track.is-starting { border-left-color: var(--ochre); }
.track h3 { font-family: var(--serif); font-size: 1.1rem; margin: 0 0 0.35rem; font-weight: 600; }
.track p { margin: 0 0 0.5rem; font-size: 13.5px; }
.track p:last-child { margin-bottom: 0; color: var(--muted); }
.track .state {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}

/* --- the sub-document link ---------------------------------------- */

.child {
  display: block; text-decoration: none; color: inherit;
  background: var(--accent-soft); border: 1px solid var(--accent);
  border-radius: 3px; padding: 1.1rem 1.2rem;
}
.child:hover { background: var(--surface); }
.child .kicker {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent);
}
.child h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0.3rem 0 0.3rem; font-weight: 600; }
.child p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.child .go { color: var(--accent); font-size: 13px; margin-top: 0.6rem; display: block; }

/* --- tables ------------------------------------------------------- */

.scroller { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 0.5rem 0.8rem 0.5rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
  border-bottom-color: var(--rule-strong); white-space: nowrap;
}
td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
code, .mono { font-family: var(--mono); font-size: 11.5px; }

.chip {
  display: inline-block; font-family: var(--mono); font-size: 10.5px;
  padding: 0.1rem 0.4rem; border: 1px solid var(--rule-strong);
  border-radius: 2px; color: var(--muted); white-space: nowrap;
}
.chip.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.blocked { background: var(--removed-bg); border-color: var(--removed); color: var(--removed); }
.chip.openstate { background: var(--ochre-bg); border-color: var(--ochre); color: var(--ochre); }

/* --- proportion meters -------------------------------------------- */
/* One measure, one hue: built as a share of authored. The number is
   always printed beside the bar, so the bar is never the only reading. */

.meter { display: block; width: 100%; max-width: 190px; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
td.meter-cell { width: 200px; padding-top: 0.75rem; }

/* --- gates -------------------------------------------------------- */

.gate-mark { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.gate-mark.met { color: var(--accent); }
.gate-mark.unmet { color: var(--muted); }

/* --- figure ------------------------------------------------------- */

figure { margin: 1.4rem 0 0; }
figure svg { max-width: 100%; height: auto; display: block; }
figure svg .hi { stroke: var(--accent); }
figure svg text.hi { fill: var(--accent); stroke: none; }
figure svg .hifill { fill: var(--accent); stroke: none; }
figcaption { font-size: 12.5px; color: var(--muted); margin-top: 0.7rem; max-width: 62ch; }

details { margin-top: 0.6rem; }
summary { font-size: 12.5px; color: var(--muted); cursor: pointer; width: fit-content; }
summary:hover { color: var(--ink); }

.footnote {
  margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule);
  font-size: 12.5px; color: var(--muted); max-width: 66ch;
}

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .toc { position: static; flex-flow: row wrap; padding-top: 1.25rem; gap: 0 1rem; }
  .toc a { border-left: 0; border-bottom: 2px solid var(--rule); padding: 0.3rem 0; }
  td.meter-cell { width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

const D = DATA.derived;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const $ = (s) => document.querySelector(s);

$("#eyebrow").textContent = "Project roadmap · updated " + DATA.updated;
$("#title").textContent = DATA.title;
$("#subtitle").textContent = DATA.subtitle;

for (const [term, value, sub] of [
  ["Contracts", D.totals.contracts],
  ["Canonical records", D.totals.records.toLocaleString()],
  ["Kickoff items done", D.kickoffDone, "of " + D.kickoffTotal],
  ["Open findings", D.openFindings],
  ["Release gates met", D.gatesMet, "of " + D.gates.length],
]) {
  const d = el("div", "tally");
  d.append(el("dt", null, term));
  const dd = el("dd", null, String(value));
  if (sub) { dd.append(" "); dd.append(el("small", null, sub)); }
  d.append(dd);
  $("#tallies").append(d);
}

const main = $("#main");
const toc = $("#toc");

function section(id, heading, lede) {
  const s = el("section");
  s.id = id;
  s.append(el("h2", null, heading));
  if (lede) s.append(el("p", "lede", lede));
  main.append(s);
  const a = el("a", null, heading);
  a.href = "#" + id;
  toc.append(a);
  return s;
}

function table(host, headers, rows) {
  const wrap = el("div", "scroller");
  const t = el("table");
  const tr = el("tr");
  for (const h of headers) tr.append(el("th", null, h.label !== undefined ? h.label : h));
  const thead = el("thead"); thead.append(tr); t.append(thead);
  const tbody = el("tbody");
  for (const row of rows) {
    const r = el("tr");
    for (const cell of row) {
      const td = el("td", cell.cls || null);
      if (cell.node) td.append(cell.node);
      else if (cell.mono) td.append(el("code", null, cell.text));
      else td.textContent = cell.text;
      r.append(td);
    }
    tbody.append(r);
  }
  t.append(tbody);
  wrap.append(t);
  host.append(wrap);
}

/* --- where things stand ------------------------------------------- */

const tracks = section("tracks", "Where things stand",
  "Three things are in play at once, and they are at very different stages.");
const box = el("div", "tracks");
for (const t of DATA.tracks) {
  const c = el("article", "track is-" + t.state);
  c.append(el("p", "state", t.state));
  c.append(el("h3", null, t.name));
  c.append(el("p", null, t.line));
  c.append(el("p", null, t.detail));
  box.append(c);
}

tracks.append(flowDiagram());

  "eligibility rule, UI state or conflict winner may be chosen or inferred outside it.");

              : i.state === "waiting" ? "waiting · " + i.awaiting
              : i.state === "done" ? "done · " + i.date : "open";
  return [
    { text: String(i.n), cls: "num" },
    { text: i.title },
    { node: el("span", "chip " + chipCls, label) },
    { text: i.note },
  ];
}));

const hist = el("details");

const list = el("div", "scroller");
const ht = el("table");
const htb = el("tbody");

const foot = el("p", "footnote");
